<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>EduPlatform - Comprehensive Online Learning Management System</title>
  <meta name="description"
    content="Transform your learning experience with our comprehensive online platform. Access courses, manage assignments, track progress, and connect with instructors in one unified system." />
  <meta name="keywords"
    content="online learning, education platform, LMS, courses, assignments, e-learning, student portal, instructor dashboard" />
  <meta name="author" content="EduPlatform Team" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eduplatform.example.com/" />
  <meta property="og:title" content="EduPlatform - Online Learning Management System" />
  <meta property="og:description"
    content="Transform your learning experience with our comprehensive online platform. Access courses, manage assignments, and track your progress." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://eduplatform.example.com/" />
  <meta property="twitter:title" content="EduPlatform - Online Learning Management System" />
  <meta property="twitter:description"
    content="Transform your learning experience with our comprehensive online platform." />
  <meta property="twitter:image" content="/twitter-image.jpg" />

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="msapplication-TileColor" content="#2563eb" />

  <!-- Preconnect to external domains for better performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />

  <!-- Google Fonts (if you want to use them) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Prevent FOUC (Flash of Unstyled Content) -->
  <style>
    /* Hide root initially to prevent FOUC */
    #root {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    #root.loaded {
      opacity: 1;
    }

    /* Basic reset and font setup */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f9fafb;
    }
  </style>
</head>

<body>
  <!-- Main App Container -->
  <div id="root"></div>

  <!-- Scripts -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Loading Screen Handler -->
  <script>
    // Show root when React app is ready
    window.addEventListener('load', function () {
      setTimeout(function () {
        const root = document.getElementById('root');
        if (root) {
          root.classList.add('loaded');
        }
      }, 100);
    });

    // Analytics (replace with your actual analytics code)
    // Google Analytics, Mixpanel, etc.

    // Service Worker Registration (for PWA features)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (registration) {
            console.log('SW registered: ', registration);
          })
          .catch(function (registrationError) {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>

  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "EduPlatform",
      "description": "Comprehensive Online Learning Management System",
      "url": "https://eduplatform.example.com",
      "logo": "https://eduplatform.example.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-EDU-LEARN",
        "contactType": "Customer Service"
      },
      "sameAs": [
        "https://www.facebook.com/eduplatform",
        "https://www.twitter.com/eduplatform",
        "https://www.linkedin.com/company/eduplatform"
      ]
    }
    </script>
</body>

</html>
